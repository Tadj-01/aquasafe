
name: frontend
description: "AquaSafe - Water Leak Reporting and Management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_sign_in: ^6.2.2
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/water_drop.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/water_drop.png"

  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg
    - assets/images/logo_outside.jpg
